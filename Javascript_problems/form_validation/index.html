<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <section class="form_container">
        <div class="main_form">
            <form id="Form">
                <div class="name_validation">
                    <label for="name">Name</label>
                    <input type="text" name="name" id="user_name" placeholder="Enter Your Name">
                    <p id="show_validation"></p>
                </div>
                <div class="name_validation">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="Enter Your Email">
                    <p></p>
                </div>
                <div class="name_validation">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" placeholder="Enter Your Password">
                    <p></p>
                </div>
                <div class="name_validation">
                    <label for="radio">Gender</label>
                    <input type="radio" name="gender" id="Male" value="Male" /> Male

                    <input type="radio" name="gender" id="Female" value="Female" /> Female
                </div>

                <div class="name_validation">
                    <input type="checkbox" name="subscribe">
                    <label for="checkbox">You must be follow our terms and condition</label>
                </div>

                <div class="range">
                    <label for="range">Range</label>
                    <input type="range">
                    <span id="update">0</span>
                </div>
                
                <div class="submit_btn">
                    <input type="submit" value="Submit" class="btn" id="btn">
                </div>

            </form>
        </div>
    </section>
    <script src="./script.js"></script>
</body>
</html>
